name: E2E (against distro candidate)

# Downloads a published distro tarball (Release asset OR auto-archive at a
# tag/SHA) and runs the harness Playwright suite against it. This is the
# implementer-perspective smoke: registry-only images, no local builds, no
# source-tree assumptions — the same shape an Ozone consumer or a fresh
# `curl + tar xz + docker compose up -d` flow gets.
#
# Triggers:
#   - workflow_dispatch  (manual; pick a distro ref to validate)
#   - schedule           (nightly against latest distro tag)
#
# To validate a candidate before tagging, run with `distro_ref` set to the
# main-branch SHA the artifact was built from (Phase 3 release.yml in distro
# uploads a workflow artifact for every push to main; this workflow could
# be extended later to download that artifact directly).

on:
  workflow_dispatch:
    inputs:
      distro_ref:
        description: "Distro ref to validate (tag or commit SHA on main)"
        required: true
        default: "3.2.2.0"
  schedule:
    - cron: "0 4 * * *"  # 04:00 UTC nightly

env:
  DISTRO_REPO: DIGI-UW/openelis-madagascar-distro
  DISTRO_REF: ${{ inputs.distro_ref || '3.2.2.0' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # compose.validate.yaml builds the analyzer mock from OE2 and mounts the
      # bridge's analyzer profiles into it; without both the mock cannot start.
      OE_REPO: ${{ github.workspace }}/OpenELIS-Global-2
      BRIDGE_REPO: ${{ github.workspace }}/openelis-analyzer-bridge
      # Both of these resolve against compose's project directory, which is
      # distro/ here because it holds the first -f argument. Anchor them.
      HARNESS_DEMO_CONTEXT: ${{ github.workspace }}/tests/playwright
      HARNESS_TEST_RESULTS_DIR: ${{ github.workspace }}/test-results
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4

      - name: Checkout OE2 (build context for the analyzer mock)
        uses: actions/checkout@v4
        with:
          repository: DIGI-UW/OpenELIS-Global-2
          ref: develop
          path: OpenELIS-Global-2

      - name: Checkout bridge (analyzer profiles for the mock)
        uses: actions/checkout@v4
        with:
          repository: DIGI-UW/openelis-analyzer-bridge
          ref: develop
          path: openelis-analyzer-bridge

      - name: Download distro candidate
        run: |
          set -euo pipefail
          mkdir -p distro
          curl -sSfL "https://github.com/${DISTRO_REPO}/archive/refs/tags/${DISTRO_REF}.tar.gz" \
            | tar xz -C distro --strip-components=1
          ls -la distro/

      - name: Start stack (registry images only)
        run: |
          docker compose \
            -f distro/docker-compose.yml \
            -f compose.validate.yaml \
            up -d

      - name: Wait for core services
        run: |
          set -euo pipefail
          max_attempts=60
          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            healthy_count="$(docker compose -f distro/docker-compose.yml -f compose.validate.yaml ps --format json | jq -r 'select(.Health == "healthy") | .Service' | wc -l)"
            if [ "$healthy_count" -ge 3 ]; then
              echo "Core services are healthy"
              exit 0
            fi
            echo "Waiting ($attempt/$max_attempts)"
            sleep 5
            attempt=$((attempt + 1))
          done
          docker compose -f distro/docker-compose.yml -f compose.validate.yaml ps
          exit 1

      - name: Run foundational + demo Playwright suites
        run: |
          set -euo pipefail
          COMPOSE_PROFILES=demo docker compose \
            -f distro/docker-compose.yml \
            -f compose.validate.yaml \
            run --rm demo-tests \
            npx playwright test \
            --project=harness-foundational \
            --config=playwright.config.ts \
            --workers=1

      - name: Collect logs on failure
        if: failure()
        run: |
          mkdir -p test-artifacts
          docker compose -f distro/docker-compose.yml -f compose.validate.yaml logs > test-artifacts/all-services.log || true
          docker compose -f distro/docker-compose.yml -f compose.validate.yaml ps > test-artifacts/compose-ps.txt || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ env.DISTRO_REF }}
          path: |
            test-results
            test-artifacts
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: docker compose -f distro/docker-compose.yml -f compose.validate.yaml down -v
