name: Analyzer Validation

on:
  pull_request:
  workflow_dispatch:
    inputs:
      distro_ref:
        description: "Distro ref to validate against (branch, tag, or SHA)"
        required: false
        default: ""
      oe_ref:
        description: "OE2 ref to checkout for seed scripts (branch, tag, or SHA)"
        required: false
        default: "develop"
      bridge_ref:
        description: "Bridge ref to checkout for seed scripts (branch, tag, or SHA)"
        required: false
        default: "develop"

env:
  # Default fallback in case the "Resolve distro from lock" step doesn't run
  # (e.g. on a config-validation only path). The resolver overrides this via
  # $GITHUB_ENV so the compose_file from distro.lock.yml takes effect.
  COMPOSE_FILES: -f distro/docker-compose.yml -f compose.dev.yaml -f compose.validate.yaml

jobs:
  analyzer-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OE_REPO: ${{ github.workspace }}/OpenELIS-Global-2
      BRIDGE_REPO: ${{ github.workspace }}/openelis-analyzer-bridge
      DISTRO_REPO: ${{ github.workspace }}/distro
      # demo-tests' build context is `tests/playwright`, but compose's
      # project-dir is `distro/` (parent of first -f arg), so the relative
      # path resolves to distro/tests/playwright (doesn't exist). Anchor it
      # absolutely here.
      HARNESS_DEMO_CONTEXT: ${{ github.workspace }}/tests/playwright
      # Playwright test-results bind mount also resolves against compose's
      # project-dir (= distro/), so absolute-path it for upload-artifact.
      HARNESS_TEST_RESULTS_DIR: ${{ github.workspace }}/test-results
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4

      - name: Resolve distro from lock
        id: distro
        run: |
          set -euo pipefail
          # Use the same lock fields the local resolver consumes
          # (scripts/resolve-distro.sh) so CI validates exactly what
          # distro.lock.yml describes — repository, ref, and compose file.
          # Any field can be overridden by workflow inputs.
          parse() {
            sed -nE "s|^[[:space:]]*$1:[[:space:]]*['\"]?([^'\"#]+)['\"]?[[:space:]]*(#.*)?\$|\\1|p" distro.lock.yml \
              | head -n1 | sed -E 's/[[:space:]]+$//'
          }
          repository="$(parse repository)"
          ref="${{ inputs.distro_ref || '' }}"
          if [ -z "$ref" ]; then ref="$(parse ref)"; fi
          compose_file="$(parse compose_file)"
          [ -z "$compose_file" ] && compose_file="docker-compose.yml"
          if [ -z "$repository" ] || [ -z "$ref" ]; then
            echo "ERROR: distro.lock.yml must define repository and ref" >&2
            exit 1
          fi
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "ref=$ref"               >> "$GITHUB_OUTPUT"
          echo "compose_file=$compose_file" >> "$GITHUB_OUTPUT"
          # Export the resolved -f flag-string for downstream `docker compose`
          # steps so they all use the lock-declared compose file rather than
          # the hardcoded default.
          echo "COMPOSE_FILES=-f distro/${compose_file} -f compose.dev.yaml -f compose.validate.yaml" >> "$GITHUB_ENV"

      - name: Checkout distro
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.distro.outputs.repository }}
          ref: ${{ steps.distro.outputs.ref }}
          path: distro

      - name: Checkout OE2 (build context for webapp/frontend/db/fhir/proxy/mock + seed-analyzers.sh)
        uses: actions/checkout@v4
        with:
          repository: DIGI-UW/OpenELIS-Global-2
          ref: ${{ inputs.oe_ref || 'develop' }}
          path: OpenELIS-Global-2
          submodules: recursive

      - name: Checkout bridge (build context)
        uses: actions/checkout@v4
        with:
          repository: DIGI-UW/openelis-analyzer-bridge
          ref: ${{ inputs.bridge_ref || 'develop' }}
          path: openelis-analyzer-bridge

      # Bring up the stack via the SAME script local dev uses, so CI stays
      # honest with operator-facing flow. --clean wipes any leftover state;
      # --seed-harness runs OE2's seed-analyzers.sh against the running
      # stack (registry-API seeding, no Liquibase). restart-stack.sh's
      # internal /health + ValidateLogin probe is the readiness contract.
      - name: Bring up stack via restart-stack.sh
        run: ./scripts/restart-stack.sh --clean --seed-harness

      # QC config seed (control lots, Westgard rules) — required for any
      # test that exercises the QC pipeline end-to-end. Idempotent.
      - name: Seed QC config via seed-qc.sh
        env:
          BASE_URL: https://localhost
        run: ./scripts/seed-qc.sh

      - name: API contract smoke tests
        id: api_contract
        run: |
          set -euo pipefail
          COMPOSE_PROFILES=demo docker compose ${{ env.COMPOSE_FILES }} run --rm demo-tests \
            npx playwright test \
            --project=harness-foundational \
            --config=playwright.config.ts \
            --workers=1

      - name: Run focused analyzer subset
        id: run_subset
        if: steps.api_contract.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          COMPOSE_PROFILES=demo docker compose ${{ env.COMPOSE_FILES }} run --rm demo-tests \
            npx playwright test \
            --project=harness-demo \
            --config=playwright.config.ts \
            --workers=1 \
            --grep 'GeneXpert ASTM|Mindray BC-5380|QuantStudio 7|Thermo Multiskan FC'

      - name: Record analyzer subset outcome
        if: always()
        run: |
          if [ "${{ steps.run_subset.outcome }}" != "success" ]; then
            echo "Analyzer subset reported failures; logs and artifacts have been uploaded for triage."
          fi

      - name: Collect service logs
        if: always()
        run: |
          mkdir -p test-artifacts
          docker compose ${{ env.COMPOSE_FILES }} logs openelisglobal-webapp > test-artifacts/openelisglobal-webapp.log || true
          docker compose ${{ env.COMPOSE_FILES }} logs openelis-analyzer-bridge > test-artifacts/openelis-analyzer-bridge.log || true
          docker compose ${{ env.COMPOSE_FILES }} logs analyzer-mock > test-artifacts/analyzer-mock.log || true
          docker compose ${{ env.COMPOSE_FILES }} ps > test-artifacts/compose-ps.txt || true

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-validation-artifacts
          path: |
            test-results
            test-artifacts
          if-no-files-found: warn

      - name: Tear down stack
        if: always()
        run: docker compose ${{ env.COMPOSE_FILES }} down -v
